name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://borafest_test:borafest_test@localhost:5432/borafest_test?schema=public
      REDIS_URL: redis://localhost:6379
      PAYMENTS_PROVIDER: mock
      SESSION_JWT_SECRET: ci-only-session-secret-at-least-32-characters
      MOCK_WEBHOOK_SECRET: ci-only-mock-webhook-secret
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: borafest_test
          POSTGRES_PASSWORD: borafest_test
          POSTGRES_DB: borafest_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U borafest_test -d borafest_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      - name: Gerar Prisma Client
        run: pnpm --filter @borafest/database exec prisma generate

      - name: Aplicar migrations e criar papéis de teste
        run: |
          pnpm --filter @borafest/database exec prisma migrate deploy
          pnpm --filter @borafest/database seed

      - name: Typecheck do monorepo
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Testes unitários
        run: pnpm test

      - name: Typecheck do app mobile
        run: pnpm --filter @borafest/mobile-checkin typecheck

      # compatibilidade criptográfica servidor ↔ app de check-in
      - name: Verificação cruzada do QR (node assina, app verifica)
        run: |
          cd packages/tickets && npx tsx -e "
          import { generateEventKeyPair, signTicketToken } from './src/qr-token';
          import { verifyTicketTokenSignature } from '../../apps/mobile-checkin/src/qr/verifyTicketToken';
          const pair = generateEventKeyPair();
          const token = signTicketToken({ v: 1, eid: 'e', tid: 't', lid: 'l', n: 'n', iat: 1 }, pair.privateKeyPem);
          if (!verifyTicketTokenSignature(token, pair.publicKeyPem)) { throw new Error('token válido não verificou'); }
          if (verifyTicketTokenSignature(token.slice(0, -4) + 'AAAA', pair.publicKeyPem)) { throw new Error('token adulterado passou'); }
          console.log('verificação cruzada OK');
          "
