# API e worker rodam no host (via `pnpm dev`), não em container — por isso o
# scrape aponta para host.docker.internal em vez do nome de um serviço compose.
global:
  scrape_interval: 10s

scrape_configs:
  - job_name: borafest-api
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:3333"]

  - job_name: borafest-worker
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:9464"]
