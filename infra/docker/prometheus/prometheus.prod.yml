# Em produção api/worker rodam como serviços do próprio compose (EasyPanel ou
# standalone com Caddy) — por isso o scrape usa os nomes de serviço, não
# host.docker.internal como no prometheus.yml de dev.
global:
  scrape_interval: 15s

scrape_configs:
  - job_name: borafest-api
    metrics_path: /metrics
    # 2026-10-12: /metrics exige "Authorization: Bearer $METRICS_TOKEN"; o
    # entrypoint do serviço grava o token neste arquivo
    authorization:
      credentials_file: /tmp/metrics_token
    static_configs:
      - targets: ["api:3333"]

  - job_name: borafest-worker
    metrics_path: /metrics
    authorization:
      credentials_file: /tmp/metrics_token
    static_configs:
      - targets: ["worker:9464"]
