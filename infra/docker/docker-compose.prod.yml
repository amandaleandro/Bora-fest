# Produção/homologação num único host (piloto — arquitetura §5).
# Uso (na raiz do repo):
#   cp .env.production.example .env.production   # e preencha
#   docker compose -f infra/docker/docker-compose.prod.yml --env-file .env.production up -d --build
#
# DNS esperado (aponte para o IP do servidor):
#   ${CHECKOUT_DOMAIN}, ${PRODUCER_DOMAIN}, ${ADMIN_DOMAIN}, ${API_DOMAIN}

name: borafest-prod

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: ${POSTGRES_DB:-borafest}
    volumes:
      - borafest_prod_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:?}"]
      interval: 10s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - borafest_prod_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12

  # one-shot: aplica migrations e sai — api/worker só sobem depois dele
  migrate:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.backend
      target: api
    # migrations + seed das roles (sem as roles, criar organização quebra)
    command: ["sh", "-c", "cd packages/database && npx prisma migrate deploy && npx tsx src/seed.ts"]
    environment:
      DATABASE_URL: ${DATABASE_URL:?}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.backend
      target: api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      API_PORT: 3333
      DATABASE_URL: ${DATABASE_URL:?}
      REDIS_URL: redis://redis:6379
      SESSION_JWT_SECRET: ${SESSION_JWT_SECRET:?}
      PAYMENTS_PROVIDER: ${PAYMENTS_PROVIDER:-asaas}
      ASAAS_API_KEY: ${ASAAS_API_KEY:-}
      ASAAS_WEBHOOK_TOKEN: ${ASAAS_WEBHOOK_TOKEN:-}
      PAGARME_SECRET_KEY: ${PAGARME_SECRET_KEY:-}
      PAGARME_WEBHOOK_BASIC_USER: ${PAGARME_WEBHOOK_BASIC_USER:-}
      PAGARME_WEBHOOK_BASIC_PASSWORD: ${PAGARME_WEBHOOK_BASIC_PASSWORD:-}
      MOCK_WEBHOOK_SECRET: ${MOCK_WEBHOOK_SECRET:-}
      WEB_BASE_URL: https://${CHECKOUT_DOMAIN:?}
      PRODUCER_BASE_URL: https://${PRODUCER_DOMAIN:?}
      CORS_ORIGINS: https://${CHECKOUT_DOMAIN:?},https://${PRODUCER_DOMAIN:?},https://${ADMIN_DOMAIN:?}
      TRUST_PROXY: "true"
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-devlog}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      WHATSAPP_PROVIDER: ${WHATSAPP_PROVIDER:-devlog}
      WHATSAPP_CLOUD_TOKEN: ${WHATSAPP_CLOUD_TOKEN:-}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}
      API_PUBLIC_URL: https://${API_DOMAIN:?}
      ANTICIPATION_FEE_BPS_MONTHLY: ${ANTICIPATION_FEE_BPS_MONTHLY:-125}
      AUTO_PAYOUT_MIN_CENTS: ${AUTO_PAYOUT_MIN_CENTS:-5000}
      PLATFORM_PIX_FEE_BPS: ${PLATFORM_PIX_FEE_BPS:-499}
      PLATFORM_PIX_FEE_FLOOR_CENTS: ${PLATFORM_PIX_FEE_FLOOR_CENTS:-249}
      PLATFORM_CARD_FEE_BPS: ${PLATFORM_CARD_FEE_BPS:-699}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3333/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10

  worker:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.backend
      target: worker
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:?}
      REDIS_URL: redis://redis:6379
      PAYMENTS_PROVIDER: ${PAYMENTS_PROVIDER:-asaas}
      ASAAS_API_KEY: ${ASAAS_API_KEY:-}
      ASAAS_WEBHOOK_TOKEN: ${ASAAS_WEBHOOK_TOKEN:-}
      PAGARME_SECRET_KEY: ${PAGARME_SECRET_KEY:-}
      MOCK_WEBHOOK_SECRET: ${MOCK_WEBHOOK_SECRET:-}
      WEB_BASE_URL: https://${CHECKOUT_DOMAIN:?}
      PRODUCER_BASE_URL: https://${PRODUCER_DOMAIN:?}
      CORS_ORIGINS: https://${CHECKOUT_DOMAIN:?},https://${PRODUCER_DOMAIN:?},https://${ADMIN_DOMAIN:?}
      TRUST_PROXY: "true"
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-devlog}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      WHATSAPP_PROVIDER: ${WHATSAPP_PROVIDER:-devlog}
      WHATSAPP_CLOUD_TOKEN: ${WHATSAPP_CLOUD_TOKEN:-}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}
      API_PUBLIC_URL: https://${API_DOMAIN:?}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  checkout:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.web
      args:
        APP: checkout
        NEXT_PUBLIC_API_URL: https://${API_DOMAIN:?}
    restart: unless-stopped

  producer:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.web
      args:
        APP: producer
        NEXT_PUBLIC_API_URL: https://${API_DOMAIN:?}
    restart: unless-stopped

  admin:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.web
      args:
        APP: admin
        NEXT_PUBLIC_API_URL: https://${API_DOMAIN:?}
    restart: unless-stopped

  # api/worker expõem /metrics (3333 e 9464), coletados aqui. Sem domínio nem
  # porta publicada de propósito — só acessível dentro da rede do compose
  # (o Grafana consulta pelo nome do serviço); expor Prometheus cru na
  # internet vaza métricas de negócio (volume de vendas etc).
  prometheus:
    image: prom/prometheus:v2.55.1
    restart: unless-stopped
    volumes:
      - ./prometheus/prometheus.prod.yml:/etc/prometheus/prometheus.yml:ro
      - borafest_prod_prometheus:/prometheus

  grafana:
    image: grafana/grafana:11.3.0
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SERVER_ROOT_URL: https://${GRAFANA_DOMAIN:?}
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - borafest_prod_grafana:/var/lib/grafana
    depends_on:
      - prometheus

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      API_DOMAIN: ${API_DOMAIN:?}
      CHECKOUT_DOMAIN: ${CHECKOUT_DOMAIN:?}
      PRODUCER_DOMAIN: ${PRODUCER_DOMAIN:?}
      ADMIN_DOMAIN: ${ADMIN_DOMAIN:?}
      GRAFANA_DOMAIN: ${GRAFANA_DOMAIN:?}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - borafest_prod_caddy_data:/data
      - borafest_prod_caddy_config:/config
    depends_on:
      - api
      - checkout
      - producer
      - admin
      - grafana

volumes:
  borafest_prod_postgres:
  borafest_prod_redis:
  borafest_prod_caddy_data:
  borafest_prod_caddy_config:
  borafest_prod_prometheus:
  borafest_prod_grafana:
